services:
  lara-langgraph:
    container_name: lara-langgraph
    build:
      context: .
      dockerfile: Dockerfile.langgraph
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - TZ=America/Sao_Paulo
      - LARA_STATE_FILE=/data/lara_sessions.json
    volumes:
      - lara_langgraph_data:/data
    networks:
      - orion-crm_app_network_v2

volumes:
  lara_langgraph_data:

networks:
  orion-crm_app_network_v2:
    external: true
